<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172033"><title>مَوعد | Maw3id</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:#f6f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:20px}.brand{text-align:center;padding:26px 0 18px}.brand h1{margin:0;font-size:34px}.brand p{margin:7px 0;color:#6b7280}.card{background:#fff;border:1px solid #e6e8ef;border-radius:22px;padding:20px;box-shadow:0 8px 30px #1720330b;margin-bottom:16px}.step{font-size:13px;color:#7b8190;margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.btn{border:1px solid #d9dde7;background:#fff;border-radius:13px;padding:13px 8px;font-size:15px;cursor:pointer}.btn:hover{border-color:#172033}.btn.selected{background:#172033;color:white;border-color:#172033}.btn.disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}.field{margin:12px 0}.field label{display:block;font-size:14px;margin-bottom:7px}.field input,.field textarea{width:100%;padding:13px;border:1px solid #d9dde7;border-radius:12px;font:inherit}.primary{width:100%;border:0;background:#172033;color:#fff;border-radius:14px;padding:15px;font-size:16px;cursor:pointer}.primary:disabled{opacity:.5}.muted{color:#6b7280;font-size:13px}.notice{padding:12px;border-radius:12px;background:#f1f5f9;margin:10px 0}.success{display:none;text-align:center}.success h2{margin-bottom:8px}.linkbox{display:flex;gap:8px}.linkbox input{flex:1}.copy{border:0;border-radius:12px;padding:0 14px}.error{color:#b42318;font-size:14px}.hidden{display:none!important}@media(max-width:520px){.times{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}.card{padding:16px}}
</style></head><body><main class="wrap"><header class="brand"><h1>مَوعد</h1><p>حجز وإدارة جلسات المحكمة</p></header>
<section id="booking" class="card"><div class="step">1 — اختاري التاريخ</div><div class="grid"><button class="btn" id="prev">السابق</button><button class="btn" id="next">التالي</button></div><div id="dateLabel" class="notice"></div><div class="step">2 — اختاري الوقت <span class="muted">(مدة الجلسة ساعتان)</span></div><div id="times" class="times"></div><div id="timeError" class="error"></div>
<div class="step" style="margin-top:20px">3 — بيانات الحاجز</div><div class="field"><label>الاسم الكامل</label><input id="name" autocomplete="name" placeholder="الاسم الكامل"></div><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></div><div class="field"><label>ملاحظات (اختياري)</label><textarea id="notes" rows="3" placeholder="أي تفاصيل إضافية"></textarea></div><div id="formError" class="error"></div><button id="book" class="primary" disabled>تأكيد الحجز</button></section>
<section id="success" class="card success"><h2>تم الحجز بنجاح ✓</h2><p id="summary"></p><div class="notice">أرسلنا تفاصيل الجلسة إلى بريدك الإلكتروني. يمكنك أيضًا نسخ الرابط الآن.</div><div class="linkbox"><input id="meeting" readonly><button class="copy" id="copy">نسخ</button></div><p class="muted" id="code"></p></section>
</main><script>
const state={date:new Date(),time:null};const $=id=>document.getElementById(id);function pad(n){return String(n).padStart(2,'0')}function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function fmtTime(t){let [h,m]=t.split(':').map(Number),ap=h<12?'ص':'م',hh=h%12||12;return `${hh}:${pad(m)} ${ap}`}function fmtDate(d){return d.toLocaleDateString('ar-SA',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}
function slots(){let a=[];for(let mins=8*60;mins<=20*60;mins+=30){let h=Math.floor(mins/60),m=mins%60,end=mins+120; if(end>22*60)return a;a.push(`${pad(h)}:${pad(m)}`)}return a}
async function load(){let date=iso(state.date);$('dateLabel').textContent=fmtDate(state.date);let r=await fetch('/api/slots?date='+date);let data=await r.json();let taken=new Set(data.taken||[]);let now=new Date();$('times').innerHTML='';slots().forEach(t=>{let [h,m]=t.split(':').map(Number),d=new Date(state.date);d.setHours(h,m,0,0);let past=iso(state.date)===iso(now)&&d<=now;let b=document.createElement('button');b.className='btn';b.textContent=fmtTime(t);b.disabled=past||taken.has(t);if(past||taken.has(t))b.classList.add('disabled');if(taken.has(t))b.title='محجوز';b.onclick=()=>{state.time=t;document.querySelectorAll('#times .btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('timeError').textContent='';check()};$('times').appendChild(b)});check()}
function check(){$('book').disabled=!(state.time&&$('name').value.trim()&&/^\S+@\S+\.\S+$/.test($('email').value.trim()))}$('prev').onclick=()=>{let d=new Date(state.date);d.setDate(d.getDate()-1);if(d>=new Date(new Date().setHours(0,0,0,0))){state.date=d;state.time=null;load()}};$('next').onclick=()=>{let d=new Date(state.date);d.setDate(d.getDate()+1);state.date=d;state.time=null;load()};['name','email','notes'].forEach(x=>$(x).addEventListener('input',check));$('book').onclick=async()=>{let payload={name:$('name').value.trim(),email:$('email').value.trim(),notes:$('notes').value.trim(),date:iso(state.date),startTime:state.time};$('book').disabled=true;$('formError').textContent='جارٍ تأكيد الحجز…';try{let r=await fetch('/api/bookings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});let d=await r.json();if(!r.ok)throw new Error(d.error||'تعذر الحجز');$('summary').innerHTML=`${d.name}<br>${d.dateLabel}<br>${d.startLabel} – ${d.endLabel}`;$('meeting').value=d.meetingUrl;$('code').textContent='رقم الحجز: '+d.bookingCode;$('booking').classList.add('hidden');$('success').style.display='block';}catch(e){$('formError').textContent=e.message;$('book').disabled=false}};$('copy').onclick=async()=>{await navigator.clipboard.writeText($('meeting').value);$('copy').textContent='تم النسخ ✓';setTimeout(()=>$('copy').textContent='نسخ',1500)};load();
</script></body></html>
