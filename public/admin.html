<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>لوحة مَوعد</title><style>body{font-family:Arial;background:#f6f7fb;padding:20px;color:#172033}.box{max-width:1000px;margin:auto;background:white;border-radius:18px;padding:20px}input,button{padding:11px;border:1px solid #ddd;border-radius:10px}button{cursor:pointer;background:#172033;color:white}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:10px;border-bottom:1px solid #eee;text-align:right}.muted{color:#777}</style><div class="box"><h1>مَوعد — لوحة الإدارة</h1><p class="muted">هذه الصفحة مخصصة لك.</p><input id="p" type="password" placeholder="كلمة المرور"><button onclick="load()">دخول</button><div id="out"></div></div><script>async function load(){let r=await fetch('/api/admin?password='+encodeURIComponent(document.getElementById('p').value));let d=await r.json();if(!r.ok)return out.innerHTML='<p>كلمة المرور غير صحيحة</p>';out.innerHTML='<table><tr><th>الاسم</th><th>التاريخ</th><th>الوقت</th><th>الحضور</th><th>البريد</th></tr>'+d.bookings.map(b=>`<tr><td>${b.name}</td><td>${b.session_date}</td><td>${b.start_time.slice(0,5)}</td><td>${b.attendance_status}</td><td>${b.email}</td></tr>`).join('')+'</table>'}</script>
