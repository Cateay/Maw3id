<!doctype html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>تسجيل الدخول — مَوعد</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #172033;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }


    .login-container {
      width: 100%;
      max-width: 430px;
    }


    /* =========================
       Logo / Brand
    ========================= */

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }


    .brand-title {
      margin: 0 0 8px;
      font-size: 30px;
      font-weight: 700;
      color: #172033;
    }


    .brand-subtitle {
      margin: 0;
      color: #777;
      font-size: 14px;
    }


    /* =========================
       Login Box
    ========================= */

    .login-box {
      background: white;
      border-radius: 22px;
      padding: 30px;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, .06);
    }


    .login-title {
      margin: 0 0 8px;
      font-size: 22px;
    }


    .login-description {
      margin: 0 0 25px;
      color: #777;
      font-size: 14px;
      line-height: 1.7;
    }


    /* =========================
       Form
    ========================= */

    .field {
      margin-bottom: 16px;
    }


    .field label {
      display: block;
      margin-bottom: 8px;

      font-size: 13px;
      font-weight: 600;
      color: #172033;
    }


    input {
      width: 100%;

      padding: 14px 15px;

      border: 1px solid #ddd;
      border-radius: 11px;

      font-size: 14px;

      outline: none;

      background: white;
      color: #172033;

      transition:
        border-color .15s,
        box-shadow .15s;
    }


    input:focus {
      border-color: #172033;

      box-shadow:
        0 0 0 3px rgba(23, 32, 51, .08);
    }


    #password {
      direction: ltr;
      text-align: left;
    }


    /* =========================
       Login Button
    ========================= */

    .login-button {
      width: 100%;

      padding: 14px;

      border: 0;
      border-radius: 11px;

      background: #172033;
      color: white;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      transition:
        opacity .15s,
        transform .05s;
    }


    .login-button:hover {
      opacity: .9;
    }


    .login-button:active {
      transform: scale(.99);
    }


    .login-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }


    /* =========================
       Error
    ========================= */

    .error {
      margin-top: 14px;

      padding: 11px 13px;

      border-radius: 10px;

      background: #ffe8e8;
      color: #b42318;

      font-size: 13px;
      line-height: 1.6;

      display: none;
    }


    .error.show {
      display: block;
    }


    /* =========================
       Footer
    ========================= */

    .footer {
      text-align: center;

      margin-top: 20px;

      color: #999;
      font-size: 12px;
    }


    /* =========================
       Mobile
    ========================= */

    @media (max-width: 500px) {

      body {
        padding: 15px;
      }


      .login-box {
        padding: 24px 20px;
        border-radius: 18px;
      }


      .brand-title {
        font-size: 27px;
      }

    }

  </style>

</head>


<body>


  <main class="login-container">


    <!-- =========================
         Brand
    ========================= -->

    <div class="brand">

      <h1 class="brand-title">
        مَوعد
      </h1>

      <p class="brand-subtitle">
        لوحة الإدارة
      </p>

    </div>


    <!-- =========================
         Login
    ========================= -->

    <section class="login-box">

      <h2 class="login-title">
        تسجيل الدخول
      </h2>


      <p class="login-description">
        أدخل كلمة مرور الإدارة للوصول إلى لوحة التحكم.
      </p>


      <form
        id="loginForm"
        autocomplete="on"
      >


        <div class="field">

          <label for="password">
            كلمة مرور الإدارة
          </label>


          <input
            id="password"
            name="password"
            type="password"
            placeholder="أدخل كلمة المرور"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          id="loginButton"
          class="login-button"
          type="submit"
        >
          دخول
        </button>


      </form>


      <div
        id="error"
        class="error"
      ></div>

    </section>


    <div class="footer">
      مَوعد — إدارة حجوزات الجلسات
    </div>


  </main>


<script>


/* =========================
   Login
========================= */

const loginForm =
  document.getElementById(
    'loginForm'
  );


const passwordInput =
  document.getElementById(
    'password'
  );


const loginButton =
  document.getElementById(
    'loginButton'
  );


const errorBox =
  document.getElementById(
    'error'
  );


/* =========================
   إذا كان مسجل دخول
========================= */

window.addEventListener(
  'DOMContentLoaded',
  () => {

    const savedPassword =
      sessionStorage.getItem(
        'maw3id_admin_password'
      );


    if (savedPassword) {

      /*
       * إذا كانت الجلسة موجودة
       * لا نخلي المستخدم يرجع لصفحة
       * تسجيل الدخول بدون داعي.
       */

      window.location.href =
        '/admin-dashboard.html';

    }

  }
);


/* =========================
   Submit
========================= */

loginForm.addEventListener(
  'submit',
  async event => {

    event.preventDefault();


    const password =
      passwordInput.value.trim();


    hideError();


    if (!password) {

      showError(
        'أدخل كلمة مرور الإدارة.'
      );

      return;

    }


    loginButton.disabled = true;

    loginButton.textContent =
      'جاري تسجيل الدخول...';


    try {

      /*
       * نستخدم نفس API الحالي
       * للتأكد من صحة كلمة المرور.
       */

      const response =
        await fetch(
          '/api/admin?password=' +
          encodeURIComponent(password)
        );


      let data = null;


      try {

        data =
          await response.json();

      } catch {

        data = null;

      }


      if (!response.ok) {

        showError(
          'كلمة المرور غير صحيحة.'
        );

        passwordInput.value = '';
        passwordInput.focus();

        return;

      }


      /*
       * كلمة المرور صحيحة.
       *
       * نحفظها في sessionStorage
       * حتى نستخدمها داخل لوحة الإدارة
       * وخصوصًا عند إرسال الإيميلات
       * وتحديث الحجوزات.
       */

      sessionStorage.setItem(
        'maw3id_admin_password',
        password
      );


      /*
       * انتقال إلى الداشبورد.
       */

      window.location.href =
        '/admin-dashboard.html';

    }


    catch (error) {

      console.error(error);


      showError(
        'حدث خطأ أثناء تسجيل الدخول. حاول مرة أخرى.'
      );

    }


    finally {

      loginButton.disabled = false;

      loginButton.textContent =
        'دخول';

    }

  }
);


/* =========================
   Error
========================= */

function showError(
  message
) {

  errorBox.textContent =
    message;


  errorBox.classList.add(
    'show'
  );

}


function hideError() {

  errorBox.textContent =
    '';


  errorBox.classList.remove(
    'show'
  );

}


/* =========================
   Enter
========================= */

passwordInput.addEventListener(
  'input',
  () => {

    hideError();

  }
);

</script>


</body>

</html>
